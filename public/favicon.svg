<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0a1a"/>
      <stop offset="50%" stop-color="#150f28"/>
      <stop offset="100%" stop-color="#08060f"/>
    </linearGradient>

    <!-- Main Gradient for M -->
    <linearGradient id="m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Cyan Glow Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.6)"/>
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.5)"/>
    </linearGradient>

    <!-- Drop Shadow Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#border-grad)" stroke-width="6"/>

  <!-- Code Brackets Overlay -->
  <!-- Left curly bracket { -->
  <path d="M 100 200 C 80 200 70 215 70 235 C 70 245 60 256 50 256 C 60 256 70 267 70 277 C 70 297 80 312 100 312" 
        fill="none" stroke="url(#cyan-grad)" stroke-width="16" stroke-linecap="round" opacity="0.6"/>

  <!-- Right curly bracket } -->
  <path d="M 412 200 C 432 200 442 215 442 235 C 442 245 452 256 462 256 C 452 256 442 267 442 277 C 442 297 432 312 412 312" 
        fill="none" stroke="url(#cyan-grad)" stroke-width="16" stroke-linecap="round" opacity="0.6"/>

  <!-- Main 'M' Monogram with Growth Arrow & Glow -->
  <g filter="url(#neon-glow)">
    <!-- Left vertical stem -->
    <path d="M 152 352 V 170 C 152 155 165 145 180 155 L 256 230 L 332 155 C 347 145 360 155 360 170 V 352" 
          fill="none" stroke="url(#m-grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Upward Growth Arrow Accent on right side -->
    <path d="M 280 254 L 375 145 M 375 145 H 325 M 375 145 V 195" 
          fill="none" stroke="url(#cyan-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>